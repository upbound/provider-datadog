apiVersion: iam.datadog.upbound.io/v1beta1
kind: TeamLink
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/teamlink
  labels:
    testing.upbound.io/example-name: foo
  name: foo
spec:
  forProvider:
    label: Link label
    position: 0
    teamIdSelector:
      matchLabels:
        testing.upbound.io/example-name: foo
    url: https://example.com

