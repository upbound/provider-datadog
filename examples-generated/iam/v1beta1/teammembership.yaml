apiVersion: iam.datadog.upbound.io/v1beta1
kind: TeamMembership
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/teammembership
  labels:
    testing.upbound.io/example-name: foo
  name: foo
spec:
  forProvider:
    role: admin
    teamIdSelector:
      matchLabels:
        testing.upbound.io/example-name: foo
    userIdSelector:
      matchLabels:
        testing.upbound.io/example-name: foo

---

apiVersion: iam.datadog.upbound.io/v1beta1
kind: Team
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/teammembership
  labels:
    testing.upbound.io/example-name: foo
  name: foo
spec:
  forProvider:
    description: Example team
    handle: example-team-updated
    name: Example Team-updated

---

apiVersion: iam.datadog.upbound.io/v1beta1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/teammembership
  labels:
    testing.upbound.io/example-name: foo
  name: foo
spec:
  forProvider:
    email: new@example.com
