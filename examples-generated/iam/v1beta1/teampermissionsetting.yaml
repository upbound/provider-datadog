apiVersion: iam.datadog.upbound.io/v1beta1
kind: TeamPermissionSetting
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/teampermissionsetting
  labels:
    testing.upbound.io/example-name: foo
  name: foo
spec:
  forProvider:
    action: manage_membership
    teamIdSelector:
      matchLabels:
        testing.upbound.io/example-name: foo
    value: organization

