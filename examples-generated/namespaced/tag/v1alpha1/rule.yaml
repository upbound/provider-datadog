apiVersion: tag.datadog.m.upbound.io/v1alpha1
kind: Rule
metadata:
  annotations:
    meta.upbound.io/example-id: tag/v1alpha1/rule
  labels:
    testing.upbound.io/example-name: env
  name: env
  namespace: upbound-system
spec:
  forProvider:
    name: env must be a known environment
    required: true
    ruleType: surfacing
    scope: org
    source: logs
    tagKey: env
    tagValuePatterns:
    - prod
    - staging
    - dev
