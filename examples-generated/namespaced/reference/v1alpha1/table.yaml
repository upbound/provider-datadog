apiVersion: reference.datadog.m.upbound.io/v1alpha1
kind: Table
metadata:
  annotations:
    meta.upbound.io/example-id: reference/v1alpha1/table
  labels:
    testing.upbound.io/example-name: s3_table
  name: s3-table
  namespace: upbound-system
spec:
  forProvider:
    description: Product catalog synced from S3
    fileMetadata:
    - accessDetails:
      - awsDetail:
        - awsAccountId: "123456789000"
          awsBucketName: my-data-bucket
          filePath: reference-tables/products.csv
      syncEnabled: true
    schema:
    - fields:
      - name: product_id
        type: STRING
      - name: product_name
        type: STRING
      - name: category
        type: STRING
      - name: price_cents
        type: INT32
      primaryKeys:
      - product_id
    source: S3
    tableName: products_catalog
    tags:
    - source:s3
    - team:catalog
    - env:production
