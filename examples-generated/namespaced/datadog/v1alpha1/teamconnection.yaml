apiVersion: datadog.m.upbound.io/v1alpha1
kind: TeamConnection
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/teamconnection
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    connectedTeam:
    - id: '@GitHubOrg/team-handle'
      type: github_team
    team:
    - idSelector:
        matchLabels:
          testing.upbound.io/example-name: example
      type: team

---

apiVersion: datadog.m.upbound.io/v1alpha1
kind: Team
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/teamconnection
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    description: Example team
    handle: example-team
    name: Example Team
