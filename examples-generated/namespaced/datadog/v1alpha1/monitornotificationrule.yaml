apiVersion: datadog.m.upbound.io/v1alpha1
kind: MonitorNotificationRule
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/monitornotificationrule
  labels:
    testing.upbound.io/example-name: team_checkout_notification_rule
  name: team-checkout-notification-rule
  namespace: upbound-system
spec:
  forProvider:
    filter:
    - tags:
      - team:payment
    name: Route alerts from checkout team
    recipients:
    - slack-checkout-ops
    - jira-checkout
