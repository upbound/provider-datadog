apiVersion: securityfindings.datadog.m.upbound.io/v1alpha1
kind: TicketCreationRule
metadata:
  annotations:
    meta.upbound.io/example-id: securityfindings/v1alpha1/ticketcreationrule
  labels:
    testing.upbound.io/example-name: critical_misconfigs
  name: critical-misconfigs
  namespace: upbound-system
spec:
  forProvider:
    action:
      assigneeId: 22222222-2222-2222-2222-222222222222
      fields: |-
        ${jsonencode({
              labels = ["security"]
            })}
      maxTicketsPerDay: 50
      projectId: 11111111-1111-1111-1111-111111111111
      target: jira
    enabled: true
    name: Auto-create Jira tickets for critical misconfigurations
    rule:
      findingTypes:
      - misconfiguration
      query: env:prod @severity:critical
