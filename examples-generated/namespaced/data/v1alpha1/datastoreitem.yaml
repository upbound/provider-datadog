apiVersion: data.datadog.m.upbound.io/v1alpha1
kind: DatastoreItem
metadata:
  annotations:
    meta.upbound.io/example-id: data/v1alpha1/datastoreitem
  labels:
    testing.upbound.io/example-name: user1
  name: user1
  namespace: upbound-system
spec:
  forProvider:
    datastoreIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    value:
      email: john@example.com
      id: user-123
      status: active
      username: john_doe

---

apiVersion: data.datadog.m.upbound.io/v1alpha1
kind: Datastore
metadata:
  annotations:
    meta.upbound.io/example-id: data.datadog/v1alpha1/datastoreitem
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    description: Datastore for user data
    name: users-datastore
    primaryColumnName: id
    primaryKeyGenerationStrategy: none
