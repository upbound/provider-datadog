apiVersion: cloudauth.datadog.m.upbound.io/v1alpha1
kind: AWSWIFIdentityMapping
metadata:
  annotations:
    meta.upbound.io/example-id: cloudauth/v1alpha1/awswifidentitymapping
  labels:
    testing.upbound.io/example-name: terraform
  name: terraform
  namespace: upbound-system
spec:
  forProvider:
    accountIdentifierSelector:
      matchLabels:
        testing.upbound.io/example-name: terraform
    arnPattern: arn:aws:sts::${data.aws_caller_identity.current.account_id}:assumed-role/terraform-runner/*

---

apiVersion: datadog.m.upbound.io/v1alpha1
kind: ServiceAccount
metadata:
  annotations:
    meta.upbound.io/example-id: cloudauth.datadog/v1alpha1/awswifidentitymapping
  labels:
    testing.upbound.io/example-name: terraform
  name: terraform
  namespace: upbound-system
spec:
  forProvider:
    email: terraform-service-account@example.com
    name: Terraform service account
    roles:
    - ${data.datadog_role.read_only.id}
