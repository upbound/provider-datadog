apiVersion: metric.datadog.upbound.io/v1beta1
kind: SpansMetric
metadata:
  annotations:
    meta.upbound.io/example-id: metric/v1beta1/spansmetric
  labels:
    testing.upbound.io/example-name: testing_spans_metric
  name: testing-spans-metric
spec:
  forProvider:
    filter:
    - query: '@http.status_code:200 service:my-service'
    groupBy:
    - path: resource_name
      tagName: resource_name
    name: testing.span.metric
