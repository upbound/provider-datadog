apiVersion: datadog.upbound.io/v1alpha1
kind: RUMMetric
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/rummetric
  labels:
    testing.upbound.io/example-name: testing_rum_metric
  name: testing-rum-metric
spec:
  forProvider:
    compute:
    - aggregationType: distribution
      includePercentiles: true
      path: '@duration'
    eventType: session
    filter:
    - query: '@service:web-ui'
    groupBy:
    - path: '@browser.name'
      tagName: browser_name
    name: testing.rum.metric
    uniqueness:
    - when: match
