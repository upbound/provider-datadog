apiVersion: statuspage.datadog.upbound.io/v1alpha1
kind: PageComponent
metadata:
  annotations:
    meta.upbound.io/example-id: statuspage/v1alpha1/pagecomponent
  labels:
    testing.upbound.io/example-name: acme_api
  name: acme-api
spec:
  forProvider:
    name: API
    pageIdSelector:
      matchLabels:
        testing.upbound.io/example-name: acme_status_page
    position: 0
    type: component

---

apiVersion: statuspage.datadog.upbound.io/v1alpha1
kind: Page
metadata:
  annotations:
    meta.upbound.io/example-id: statuspage.datadog/v1alpha1/pagecomponent
  labels:
    testing.upbound.io/example-name: acme_status_page
  name: acme-status-page
spec:
  forProvider:
    domainPrefix: acme-status
    name: Acme Status
    type: public
    visualizationType: bars_and_uptime_percentage
