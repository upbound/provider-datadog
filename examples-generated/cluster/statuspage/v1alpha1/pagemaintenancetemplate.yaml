apiVersion: statuspage.datadog.upbound.io/v1alpha1
kind: PageMaintenanceTemplate
metadata:
  annotations:
    meta.upbound.io/example-id: statuspage/v1alpha1/pagemaintenancetemplate
  labels:
    testing.upbound.io/example-name: acme_maintenance_template
  name: acme-maintenance-template
spec:
  forProvider:
    completedDescription: Maintenance is complete for the Acme API.
    componentIdsRefs:
    - name: acme_api
    inProgressDescription: Maintenance is in progress for the Acme API.
    maintenanceTitle: Acme API maintenance
    name: Scheduled Acme API maintenance
    pageIdSelector:
      matchLabels:
        testing.upbound.io/example-name: acme_status_page
    scheduledDescription: Maintenance has been scheduled for the Acme API.

---

apiVersion: statuspage.datadog.upbound.io/v1alpha1
kind: Page
metadata:
  annotations:
    meta.upbound.io/example-id: statuspage.datadog/v1alpha1/pagemaintenancetemplate
  labels:
    testing.upbound.io/example-name: acme_status_page
  name: acme-status-page
spec:
  forProvider:
    domainPrefix: acme-status
    name: Acme Status
    type: public
    visualizationType: bars_and_uptime_percentage

---

apiVersion: statuspage.datadog.upbound.io/v1alpha1
kind: PageComponent
metadata:
  annotations:
    meta.upbound.io/example-id: statuspage.datadog/v1alpha1/pagemaintenancetemplate
  labels:
    testing.upbound.io/example-name: acme_api
  name: acme-api
spec:
  forProvider:
    name: API
    pageIdSelector:
      matchLabels:
        testing.upbound.io/example-name: acme_status_page
    position: 0
    type: component
