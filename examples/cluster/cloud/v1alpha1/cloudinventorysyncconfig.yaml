apiVersion: cloud.datadog.upbound.io/v1alpha1
kind: CloudInventorySyncConfig
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/cloudinventorysyncconfig
    upjet.upbound.io/manual-intervention: "Requires a real AWS account and destination S3 bucket already configured for Datadog Cloud Inventory sync."
  labels:
    testing.upbound.io/example-name: aws_example
  name: aws-example
spec:
  forProvider:
    aws:
      awsAccountId: "123456789012"
      destinationBucketName: my-inventory-bucket
      destinationBucketRegion: us-east-1
      destinationPrefix: inventory/
    cloudProvider: aws
