apiVersion: cloudcost.datadog.upbound.io/v1alpha1
kind: CustomAllocationRules
metadata:
  annotations:
    meta.upbound.io/example-id: cloudcost/v1alpha1/customallocationrules
    upjet.upbound.io/manual-intervention: "The API answered 403 \"This feature is restricted to Cloud Cost Management users\" during e2e; the Datadog org needs Cloud Cost Management."
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    overrideUiDefinedResources: false
    ruleIdsSelector:
      matchLabels:
        testing.upbound.io/example-name: customallocationrules-rule

---

apiVersion: cloudcost.datadog.upbound.io/v1alpha1
kind: AllocationRule
metadata:
  annotations:
    meta.upbound.io/example-id: cloudcost/v1alpha1/customallocationrules
  labels:
    testing.upbound.io/example-name: customallocationrules-rule
  name: customallocationrules-rule
spec:
  forProvider:
    ruleName: production-environment-rule
    enabled: true
    providernames:
    - aws
    strategy:
      method: proportional
