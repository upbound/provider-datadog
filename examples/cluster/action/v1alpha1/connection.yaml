apiVersion: action.datadog.upbound.io/v1alpha1
kind: Connection
metadata:
  annotations:
    meta.upbound.io/example-id: action/v1alpha1/connection
    upjet.upbound.io/manual-intervention: "Requires a real AWS IAM role that trusts the Datadog Action Connection integration."
  labels:
    testing.upbound.io/example-name: aws_connection
  name: aws-connection
spec:
  forProvider:
    aws:
      assumeRole:
        accountId: "123456789012"
        role: datadog-action-connection-role
    name: My AWS Connection
    tags:
    - env:prod
    - team:action-platform
