apiVersion: datadog.upbound.io/v1alpha1
kind: OrgGroupPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/orggrouppolicy
    upjet.upbound.io/manual-intervention: "Depends on OrgGroup, which observed 501 Not Implemented during e2e (\"error retrieving org group\"); likely requires the Org Groups feature enabled for the test org."
  labels:
    testing.upbound.io/example-name: foo
  name: foo
spec:
  forProvider:
    content: '${jsonencode({ "org_config" : false })}'
    enforcementTier: OVERRIDE_ALLOWED
    orgGroupIdSelector:
      matchLabels:
        testing.upbound.io/example-name: orggrouppolicy-foo
    policyName: is_widget_copy_paste_enabled

---

apiVersion: datadog.upbound.io/v1alpha1
kind: OrgGroup
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/orggrouppolicy
  labels:
    testing.upbound.io/example-name: orggrouppolicy-foo
  name: orggrouppolicy-foo
spec:
  forProvider:
    name: Production Environments
