apiVersion: datadog.upbound.io/v1alpha1
kind: TeamHierarchyLinks
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/teamhierarchylinks
  labels:
    testing.upbound.io/example-name: foo
  name: foo
spec:
  forProvider:
    parentTeamIdSelector:
      matchLabels:
        testing.upbound.io/example-name: teamhierarchylinks-parent
    subTeamIdSelector:
      matchLabels:
        testing.upbound.io/example-name: teamhierarchylinks-sub

---

apiVersion: datadog.upbound.io/v1alpha1
kind: Team
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/teamhierarchylinks
  labels:
    testing.upbound.io/example-name: teamhierarchylinks-parent
  name: teamhierarchylinks-parent
spec:
  forProvider:
    description: Parent team
    handle: teamhierarchylinks-parent
    name: Parent Team

---

apiVersion: datadog.upbound.io/v1alpha1
kind: Team
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/teamhierarchylinks
  labels:
    testing.upbound.io/example-name: teamhierarchylinks-sub
  name: teamhierarchylinks-sub
spec:
  forProvider:
    description: Sub team
    handle: teamhierarchylinks-sub
    name: Sub Team
