apiVersion: datadog.upbound.io/v1alpha1
kind: TeamNotificationRule
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/teamnotificationrule-servicenow
  labels:
    testing.upbound.io/example-name: servicenow
  name: servicenow
spec:
  forProvider:
    servicenow:
      templates:
      - incident-template
    teamIdSelector:
      matchLabels:
        testing.upbound.io/example-name: teamnotificationrule-servicenow

---

apiVersion: datadog.upbound.io/v1alpha1
kind: Team
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/teamnotificationrule-servicenow
  labels:
    testing.upbound.io/example-name: teamnotificationrule-servicenow
  name: teamnotificationrule-servicenow
spec:
  forProvider:
    description: Example team
    handle: teamnotificationrule-servicenow
    name: Example Team ServiceNow
