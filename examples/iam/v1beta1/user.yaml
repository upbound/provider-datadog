apiVersion: iam.datadog.upbound.io/v1beta1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/user
  labels:
    testing.upbound.io/example-name: example_user
  name: uptest
spec:
  forProvider:
    email: uptest@example.com
    rolesSelector:
      matchLabels:
        testing.upbound.io/example-name: example_user

---

apiVersion: iam.datadog.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/role
  labels:
    testing.upbound.io/example-name: example_user
  name: user-example
spec:
  forProvider:
    name: uptest
    permission:
      - id: 4d87d5f8-d8b1-11e9-a77a-eb9c8350d04f
