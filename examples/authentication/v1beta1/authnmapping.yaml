apiVersion: authentication.datadog.upbound.io/v1beta1
kind: AuthnMapping
metadata:
  annotations:
    meta.upbound.io/example-id: authentication/v1beta1/authnmapping
  labels:
    testing.upbound.io/example-name: dev_ro_role_mapping
  name: dev-ro-role-mapping
spec:
  forProvider:
    key: Member-of
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: dev_ro_role_mapping
    value: Development

---

apiVersion: iam.datadog.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/role
  labels:
    testing.upbound.io/example-name: dev_ro_role_mapping
  name: dev-ro-role-mapping
spec:
  forProvider:
    name: dev_ro_role_mapping
    permission:
      - id: 4d87d5f8-d8b1-11e9-a77a-eb9c8350d04f
