apiVersion: action.datadog.m.upbound.io/v1alpha1
kind: Connection
metadata:
  annotations:
    meta.upbound.io/example-id: action/v1alpha1/connection-aws-secrets-manager
    upjet.upbound.io/manual-intervention: "Requires an existing AWS Action Connection whose role can read the referenced AWS Secrets Manager secret; externalSecretsManager.connectionId must be replaced with the id of that connection."
  labels:
    testing.upbound.io/example-name: gcp_connection
  name: gcp-connection
  namespace: upbound-system
spec:
  forProvider:
    externalSecretsManager:
      connectionId: 00000000-0000-0000-0000-000000000000
      region: us-east-1
    gcp:
      serviceAccount:
        privateKeyAwsSecretsManager:
          key: private_key
          secretId: example/gcp/service-account
        serviceAccountEmailAwsSecretsManager:
          key: client_email
          secretId: example/gcp/service-account
    name: My GCP connection with AWS Secrets Manager
