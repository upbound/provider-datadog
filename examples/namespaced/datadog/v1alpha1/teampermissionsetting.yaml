apiVersion: datadog.m.upbound.io/v1alpha1
kind: TeamPermissionSetting
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/teampermissionsetting
  labels:
    testing.upbound.io/example-name: foo
  name: foo
  namespace: crossplane-system
spec:
  forProvider:
    action: manage_membership
    teamIdSelector:
      matchLabels:
        testing.upbound.io/example-name: teampermissionsetting-foo
    value: organization

---

apiVersion: datadog.m.upbound.io/v1alpha1
kind: Team
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/teampermissionsetting
  labels:
    testing.upbound.io/example-name: teampermissionsetting-foo
  name: teampermissionsetting-foo
  namespace: crossplane-system
spec:
  forProvider:
    description: Example team
    handle: teampermissionsetting-foo
    name: teampermissionsetting-foo
