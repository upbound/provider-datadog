apiVersion: datadog.m.upbound.io/v1alpha1
kind: ServiceAccount
metadata:
  annotations:
    meta.upbound.io/example-id: datadog/v1alpha1/serviceaccount
    upjet.upbound.io/manual-intervention: The Terraform provider keeps the state of a service account that answers 404 (Read without RemoveResource since DataDog/terraform-provider-datadog#2269), so a new service account cannot be created; existing ones can be adopted through the crossplane.io/external-name annotation.
  labels:
    testing.upbound.io/example-name: bar
  name: bar
  namespace: upbound-system
spec:
  forProvider:
    email: service-account-example@example.com
    name: Service Account Bar
