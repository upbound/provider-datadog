apiVersion: synthetics.datadog.m.upbound.io/v1alpha1
kind: SyntheticsSuite
metadata:
  annotations:
    meta.upbound.io/example-id: synthetics/v1alpha1/syntheticssuite
  labels:
    testing.upbound.io/example-name: example_suite
  name: example-suite
  namespace: upbound-system
spec:
  forProvider:
    message: Example synthetics test suite
    name: Example Suite
    tags:
    - env:test
    tests:
    - alertingCriticality: ignore
      publicIdSelector:
        matchLabels:
          testing.upbound.io/example-name: syntheticssuite-foo

---

apiVersion: synthetics.datadog.m.upbound.io/v1alpha1
kind: Test
metadata:
  annotations:
    meta.upbound.io/example-id: synthetics/v1alpha1/syntheticssuite
  labels:
    testing.upbound.io/example-name: syntheticssuite-foo
  name: syntheticssuite-foo
  namespace: upbound-system
spec:
  forProvider:
    assertion:
    - operator: is
      target: "200"
      type: statusCode
    locations:
    - aws:eu-central-1
    message: Notify @pagerduty
    name: An Uptime test on example.org
    optionsList:
      monitorOptions:
        renotifyInterval: 120
      retry:
        count: 2
        interval: 300
      tickEvery: 900
    requestDefinition:
      method: GET
      url: https://www.example.org
    requestHeaders:
      Content-Type: application/json
    status: live
    subtype: http
    tags:
    - foo:bar
    - env:test
    type: api
