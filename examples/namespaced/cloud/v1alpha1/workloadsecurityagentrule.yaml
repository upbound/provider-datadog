apiVersion: cloud.datadog.m.upbound.io/v1alpha1
kind: WorkloadSecurityAgentRule
metadata:
  annotations:
    meta.upbound.io/example-id: cloud/v1alpha1/workloadsecurityagentrule
    upjet.upbound.io/manual-intervention: Cloud Workload Security must be enabled for the Datadog organization first (the API answers 404 otherwise).
  labels:
    testing.upbound.io/example-name: my_agent_rule
  name: my-agent-rule
  namespace: upbound-system
spec:
  forProvider:
    description: My agent rule
    enabled: true
    expression: exec.file.name == "java"
    name: my_agent_rule
