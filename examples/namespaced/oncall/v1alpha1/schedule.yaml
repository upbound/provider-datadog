apiVersion: oncall.datadog.m.upbound.io/v1alpha1
kind: Schedule
metadata:
  annotations:
    meta.upbound.io/example-id: oncall/v1alpha1/schedule
  labels:
    testing.upbound.io/example-name: foo
  name: foo
  namespace: upbound-system
spec:
  forProvider:
    name: Example Schedule
    timeZone: UTC
    layer:
    - name: Primary
      effectiveDate: "2026-01-01T00:00:00Z"
      rotationStart: "2026-01-01T00:00:00Z"
      interval:
        days: 7
      users:
      - ${data.datadog_current_user.me.id}
