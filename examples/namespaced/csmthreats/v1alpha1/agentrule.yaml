apiVersion: csmthreats.datadog.m.upbound.io/v1alpha1
kind: AgentRule
metadata:
  annotations:
    meta.upbound.io/example-id: csmthreats/v1alpha1/agentrule
  labels:
    testing.upbound.io/example-name: my_agent_rule
  name: my-agent-rule
  namespace: upbound-system
spec:
  forProvider:
    # The upstream docs example sets the variable from a field
    # (field: exec.file.path); the API rejects that form with 500 "failed to
    # validate rule expression", a literal value is accepted.
    actions:
    - set:
        append: false
        name: updated_security_actions
        scope: process
        value: "1"
    description: This is a rule
    enabled: true
    expression: open.file.name == "etc/shadow/password"
    name: my_agent_rule
    policyIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    productTags:
    - compliance_framework:PCI-DSS

---

apiVersion: csmthreats.datadog.m.upbound.io/v1alpha1
kind: Policy
metadata:
  annotations:
    meta.upbound.io/example-id: csmthreats/v1alpha1/agentrule
  labels:
    testing.upbound.io/example-name: example
  name: agentrule-example
  namespace: upbound-system
spec:
  forProvider:
    description: Policy backing the agentrule.yaml example
    enabled: true
    name: agentrule_example_policy
