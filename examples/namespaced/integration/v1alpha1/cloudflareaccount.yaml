apiVersion: integration.datadog.m.upbound.io/v1alpha1
kind: CloudflareAccount
metadata:
  annotations:
    meta.upbound.io/example-id: integration/v1alpha1/cloudflareaccount
    upjet.upbound.io/manual-intervention: Datadog validates the Cloudflare API key and email against Cloudflare, so a real Cloudflare account is required.
  labels:
    testing.upbound.io/example-name: foo
  name: foo
  namespace: upbound-system
spec:
  forProvider:
    apiKeySecretRef:
      key: example-key
      name: example-secret
    email: test-email@example.com
    name: test-name
