apiVersion: integration.datadog.m.upbound.io/v1alpha1
kind: DatabricksAccount
metadata:
  annotations:
    meta.upbound.io/example-id: integration/v1alpha1/databricksaccount
    upjet.upbound.io/manual-intervention: "Requires a real Databricks workspace and an OAuth service principal; workspaceUrl, clientId and the referenced secret must be replaced with its values."
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    authentication:
      databricksIntegrationAccountOAuthAuth:
        clientId: 00000000-0000-0000-0000-000000000000
        clientSecretSecretRef:
          key: example-key
          name: example-secret
    name: example-databricks
    settings:
      workspaceUrl: https://example.cloud.databricks.com
