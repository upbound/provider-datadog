apiVersion: securitymonitoring.datadog.m.upbound.io/v1alpha1
kind: NotificationRule
metadata:
  annotations:
    meta.upbound.io/example-id: securitymonitoring/v1alpha1/notificationrule
  labels:
    testing.upbound.io/example-name: signal_rule
  name: signal-rule
  namespace: upbound-system
spec:
  forProvider:
    enabled: false
    name: My signal notification rule
    selectors:
      query: env:prod
      ruleTypes:
      - workload_security
      triggerSource: security_signals
    targets:
    - '@bob@email.com'
    - '@alice@email.com'
