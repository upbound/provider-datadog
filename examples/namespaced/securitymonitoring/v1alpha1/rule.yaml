apiVersion: securitymonitoring.datadog.m.upbound.io/v1alpha1
kind: Rule
metadata:
  annotations:
    meta.upbound.io/example-id: securitymonitoring/v1alpha1/rule
    upjet.upbound.io/manual-intervention: 'Cloud SIEM must be enabled for the Datadog organization: without it the API accepts the rule, answers 404 for its id and then refuses the name as a duplicate.'
  labels:
    testing.upbound.io/example-name: myrule
  name: myrule
  namespace: upbound-system
spec:
  forProvider:
    case:
    - condition: errors > 3 && warnings > 10
      notifications:
      - '@user'
      status: high
    enabled: true
    message: The rule has triggered.
    name: My rule ${Rand.RFC1123Subdomain}
    options:
    - evaluationWindow: 300
      keepAlive: 600
      maxSignalDuration: 900
    query:
    - aggregation: count
      dataSource: logs
      groupByFields:
      - host
      name: errors
      query: status:error
    - aggregation: count
      dataSource: logs
      groupByFields:
      - host
      name: warnings
      query: status:warning
    tags:
    - type:dos
