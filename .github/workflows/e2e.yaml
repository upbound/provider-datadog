name: End to End Testing

on:
  issue_comment:
    types: [created]

jobs:
  e2e:
    uses: upbound/uptest/.github/workflows/pr-comment-trigger.yml@8965579a213ba2b249225fa311178ac66f107daf # main
    with:
      go-version: '1.21'
    secrets:
      UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
      UPTEST_DATASOURCE: ${{ secrets.UPTEST_DATASOURCE }}
